services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "${TAILSCALE_IP:?Set TAILSCALE_IP in .env before starting (see .env.example) - the app must not bind to all interfaces.}:8501:8501"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./config:/app/config
