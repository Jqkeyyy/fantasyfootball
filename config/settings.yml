paths:
  data_root: "./data"

seasons:
  train_start: 2015
  current: 2026

sleeper:
  username: "Maybe17"

model:
  positions: [QB, RB, WR, TE, K, DST]
  quantiles: [0.10, 0.25, 0.50, 0.75, 0.90]
  retrain_cadence_weeks: 1
  min_train_rows: 2000
  lightgbm:
    n_estimators: 800
    learning_rate: 0.03
    num_leaves: 31
    min_child_samples: 40
    subsample: 0.8
    colsample_bytree: 0.8
    reg_lambda: 1.0

simulation:
  season_sims: 3000
  week_sims: 20000
  correlation:
    qb_pass_catcher: 0.35
    same_team_rb_rb: -0.25
    player_vs_opposing_dst: -0.30

draft:
  adp_sd_fallback: 8.0
  tier_method: "gap"
  # Project owner streams DST/K week to week rather than drafting for
  # season-long value (2026-08-14) -- excluded from the draft board
  # entirely rather than just ranked low, so they don't clutter the
  # board's default view. See tools/streaming.py and TASKS.md 3.7.
  excluded_positions: ["DST", "K"]

waivers:
  playoff_weight: 1.5
  aggressiveness: 1.0

ingest:
  sleeper_players_cache_hours: 24
  odds_provider: "the_odds_api"

cache:
  root: "./data/raw"
  offline_default: true
  staleness_hours:
    sleeper_league: 168
    sleeper_rosters: 24
    rankings_adp: 24
    odds: 12
    weather_forecast: 6
    nflverse_player_ids: 168
    espn: 2
    cbssports: 2
    yahoo: 2
  warn_on_stale: true
