paths:
  data_root: "./data"

seasons:
  train_start: 2015
  current: 2026

sleeper:
  username: "Maybe17"

model:
  positions: [QB, RB, WR, TE, K, DST]
  quantiles: [0.10, 0.25, 0.50, 0.75, 0.90]
  retrain_cadence_weeks: 1
  min_train_rows: 2000
  # anchored | direct | baseline_b2 | consensus_b3 -- see config.ModelSettings'
  # own docstring and docs/JOURNAL.md's 2026-08-16 closing entry (task
  # 1.15/1.20 real evaluations, SPEC-ADDENDUM-04.md SS C's shipping rule).
  projection_source: "consensus_b3"
  lightgbm:
    n_estimators: 800
    learning_rate: 0.03
    num_leaves: 31
    min_child_samples: 40
    subsample: 0.8
    colsample_bytree: 0.8
    reg_lambda: 1.0

simulation:
  season_sims: 3000
  week_sims: 20000
  correlation:
    qb_pass_catcher: 0.35
    same_team_rb_rb: -0.25
    player_vs_opposing_dst: -0.30

draft:
  adp_sd_fallback: 8.0
  tier_method: "gap"
  # Project owner streams DST/K week to week rather than drafting for
  # season-long value (2026-08-14) -- excluded from the draft board
  # entirely rather than just ranked low, so they don't clutter the
  # board's default view. See tools/streaming.py and TASKS.md 3.7.
  excluded_positions: ["DST", "K"]
  # Real sensitivity analysis, 2026-08-17 (docs/JOURNAL.md's matching
  # entry has the full numbers): the standard QB10/TE10 fixed-point
  # baseline overvalues McBride/Bowers/Allen relative to expert consensus
  # and ADP; a shallower replacement rank (higher real replacement points)
  # moves them back toward consensus without disturbing RB/WR's own VOR
  # (only the board's ordinal position shifts, mechanically, as QB/TE
  # rows correctly become less competitive). QB8/TE8 barely moved
  # anything (QB8/QB10 points are nearly identical); QB6/TE6 is the
  # chosen setting -- closest to consensus at the top of the board
  # without materially disturbing RB/WR (max 7-rank shift in the real
  # top 60, mean ~1). This is a crude proxy for the real streaming
  # argument, not the principled version -- see JOURNAL for why.
  replacement_rank_offsets:
    QB: -4
    TE: -4

waivers:
  playoff_weight: 1.5
  aggressiveness: 1.0

ingest:
  sleeper_players_cache_hours: 24
  odds_provider: "the_odds_api"

cache:
  root: "./data/raw"
  offline_default: true
  staleness_hours:
    sleeper_league: 168
    sleeper_rosters: 24
    rankings_adp: 24
    odds: 12
    weather_forecast: 6
    nflverse_player_ids: 168
    espn: 2
    cbssports: 2
    yahoo: 2
  warn_on_stale: true
