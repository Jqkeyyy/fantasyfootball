# Real 2026 keepers for rogan-radinator-league, hand-entered by the project
# owner (2026-08-16) because Sleeper's own `roster.keepers` field is known
# to be wrong for this league (it incorrectly flags Jahmyr Gibbs as a
# keeper). `pick` is "<round>.<pick_within_round>" exactly as Sleeper's own
# draft board displays it -- the pick-within-round digit is the
# CHRONOLOGICAL Nth pick made in that round, not a column/slot index, so
# converting to an overall pick number is `(round - 1) * n_teams +
# pick_within_round` regardless of whether the round is odd or even
# (`draft.keepers.parse_pick_notation`). This is a real, committed
# config file (like `config/id_overrides.csv`) -- small, hand-curated,
# corrects a real upstream data bug -- not something to re-derive from
# Sleeper's own API each session.
