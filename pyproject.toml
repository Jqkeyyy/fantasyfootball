[project]
name = "ffapp"
version = "0.1.0"
description = "Personal fantasy football decision-support system"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "polars>=1.0",
    "rapidfuzz>=3.9",
    "nflreadpy>=0.1.5",
    "lxml>=6.1.1",
    "scikit-learn>=1.9.0",
    "numpy<2.5",
    "scipy>=1.13",
    "streamlit>=1.61.1",
    "lightgbm>=4.7.0",
    "pandas>=3.0.5",
    "pulp>=3.3.2",
    "anthropic>=0.122.0",
    "defusedxml>=0.7.1",
]

[project.scripts]
ffapp = "ffapp.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ffapp"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "types-PyYAML>=6.0",
    "types-requests>=2.31",
    "lxml-stubs>=0.5.1",
    "pandas-stubs>=3.0.5.260730",
    "types-defusedxml>=0.7.0.20260504",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = "yaml.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "nflreadpy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sklearn.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "scipy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "lightgbm.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pulp.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
